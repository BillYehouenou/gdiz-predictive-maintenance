name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db  # registre local, sans serveur
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - name: Lint et types
        run: uv run ruff format --check . && uv run ruff check . && uv run mypy src app simulation
      - name: Données et modèle en cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            mlflow.db
            mlruns
          key: pipeline-${{ hashFiles('simulation/**/*.py', 'src/**/*.py', 'uv.lock') }}
      - name: Générer les données, entraîner et scorer (si le cache ne correspond pas)
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python -m simulation.generer && uv run python -m src.train && uv run python -m src.modele
      - name: Tests
        run: uv run pytest tests/ --cov=src --cov=app --cov-fail-under=65
      - name: Build Docker
        run: docker build -t gdiz-maintenance:ci .
