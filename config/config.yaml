# Configuration des chemins
chemins:
  chemin_donnees_brutes: "data/raw"
  chemin_donnees_traitees: "data/processed"
  chemin_modele: "models"

# Informations sur le jeu_donnees
jeu_donnees:
  base: 'gdiz_maintenance.db'
  table: 'factory_telemetry'
  colonne_cible: 'cible_h120_predictible'
  features:
    - 'type_machine'
    - 'temperature_ambiante'
    - 'temperature_process'
    - 'vitesse_rotation'
    - 'couple'
    - 'niveau_activite'
    - 'vibration'
    - 'humidite'
    - 'concentration_poussiere'
    - 'precipitation_mm'
    - 'indicateur_coupure'
    - 'niveau_tension'
    # Compteurs GMAO : l'usure et l'encrassement eux-mêmes ne sont pas mesurables
    - 'heures_depuis_changement_outil'
    - 'heures_depuis_maintenance'
    # Features temporelles — calculées par src/features.py
    - 'vibration_max_24h'
    - 'vibration_moyenne_24h'
    - 'vibration_ecart_type_24h'
    - 'vibration_delta_4h'
    - 'temperature_process_max_24h'
    - 'temperature_process_moyenne_24h'
    - 'temperature_process_delta_4h'
    - 'ecart_thermique'
    - 'ecart_thermique_max_24h'
    - 'poussiere_moyenne_24h'
    - 'poussiere_max_24h'
    - 'couple_max_24h'

# Paramètres de tracking des expériences mlflow
mlflow:
  nom_experience: "GDIZ_Predictive_Maintenance"
  uri_suivi: "sqlite:///mlflow.db"
  nom_modele: "LGBM_Predictive_Maintenance"