<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titre }} · GDIZ Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Navigation principale">
    <div class="marque">
      <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V9l5 3V9l5 3V5h4v15"/></svg></span>
      <div><b>GDIZ Maintenance</b><span class="discret">50 machines textiles</span></div>
    </div>
    <div>
      <div class="titre-section">Suivi</div>
      <div class="liens">
        <a class="lien" href="/" {% if page == "parc" %}aria-current="page"{% endif %}>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
          Parc<span class="compteur danger" id="compteur-parc" aria-live="polite"></span>
        </a>
        <a class="lien" href="/machines" {% if page == "machine" %}aria-current="page"{% endif %}>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V10l4 2.5V10l4 2.5V6h4v14"/></svg>
          Machine
        </a>
        <a class="lien" href="/alertes" {% if page == "alertes" %}aria-current="page"{% endif %}>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9zM10 20.5a2 2 0 0 0 4 0"/></svg>
          Alertes &amp; interventions<span class="compteur warn" id="compteur-alertes" aria-live="polite"></span>
        </a>
      </div>
    </div>
    <p class="pied">Projet portfolio · données simulées, météo réelle · sans lien avec la GDIZ</p>
  </nav>

  <main class="panneau">
    <div class="contenu">
      <div class="barre-haut">
        <form class="recherche" id="recherche" role="search">
          <label for="recherche-champ" class="sr">Ouvrir une machine</label>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="recherche-champ" type="search" list="liste-machines" placeholder="Ouvrir une machine : 20, M20…" autocomplete="off">
          <datalist id="liste-machines"></datalist>
          <kbd aria-hidden="true">⌘ K</kbd>
        </form>
        <div class="actions-haut">
          <span class="pilule"><span class="point" aria-hidden="true"></span><span id="fin-donnees">Données…</span></span>
          <button type="button" class="bouton-icone" id="theme" aria-label="Changer de thème clair ou sombre">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          </button>
        </div>
      </div>
      {% block contenu %}{% endblock %}
    </div>
  </main>
</div>
<script type="module" src="/static/js/nav.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
