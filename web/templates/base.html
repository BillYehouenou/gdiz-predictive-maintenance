<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titre }} · GDIZ Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="entete-app">
  <a class="marque" href="/">
    <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V9l5 3V9l5 3V5h4v15"/></svg></span>
    GDIZ Maintenance
  </a>
  <nav class="onglets" aria-label="Navigation principale">
    <a href="/" {% if page == "parc" %}aria-current="page"{% endif %}>Parc<span class="bulle" id="bulle-parc"></span></a>
    <a href="/machines" {% if page == "machine" %}aria-current="page"{% endif %}>Machine</a>
  </nav>
  <details class="compte">
    <summary>
      <span class="avatar" aria-hidden="true">B</span>
      <span class="compte-nom"><b>Bill</b><small>Compte démo</small></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="menu">
      <button type="button" id="theme">Changer de thème</button>
      <a href="/docs">Documentation de l'API</a>
    </div>
  </details>
</header>

<main class="page">
  {% block contenu %}{% endblock %}
  <p class="pied">Projet portfolio · données simulées, météo réelle · sans lien avec la GDIZ</p>
</main>
<script type="module" src="/static/js/nav.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
