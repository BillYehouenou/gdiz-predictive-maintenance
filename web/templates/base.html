<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titre }} · GDIZ Maintenance</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    let t; try { t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
<header class="entete-app">
  <div>
    <a class="marque" href="/">
      <span class="logo" aria-hidden="true"></span>
      GDIZ Maintenance
    </a>
    <nav class="pilules onglets" aria-label="Navigation principale">
      <a href="/" {% if page == "parc" %}aria-current="page"{% endif %}>Parc</a>
      <a href="/machines" {% if page == "machine" %}aria-current="page"{% endif %}>Machine</a>
    </nav>
    <div class="compte">
      <button type="button" id="compte" aria-expanded="false" aria-haspopup="true" aria-controls="menu-compte">
        <span class="avatar" aria-hidden="true">B</span>
        <span class="compte-nom"><b>Bill Y.</b><small>Compte démo</small></span>
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu" id="menu-compte" hidden>
        <button type="button" role="switch" aria-checked="false" id="theme">Thème sombre<span class="interrupteur" aria-hidden="true"></span></button>
        <a href="https://github.com/BillYehouenou/gdiz-predictive-maintenance" target="_blank" rel="noopener">
          Documentation
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
      </div>
    </div>
  </div>
</header>

<main class="page">
  {% block contenu %}{% endblock %}
  <p class="pied">© 2026 Bill Yehouenou</p>
</main>
<script type="module" src="/static/commun.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
