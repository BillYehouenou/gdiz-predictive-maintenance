# Deux services : le registre MLflow (le seul, partagé avec make train / score / serve) et l'API.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1  # même version que le client (uv.lock)
    ports:
      - "5050:5000"  # 5050 côté Mac : le port 5000 y est pris par AirPlay
    volumes:
      - mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts  # le serveur sert les modèles : adresses valables partout
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=localhost,localhost:5000,localhost:5050,127.0.0.1:5050,mlflow,mlflow:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mlflow_data:
