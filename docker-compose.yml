# docker compose up : le registre MLflow, puis le pipeline (données, entraînement et scoring, seulement s'ils manquent),
# puis l'API et le tableau de bord sur http://localhost:8000. Données et registre sont gardés dans des volumes.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1  # même version que le client (uv.lock)
    ports:
      - "5050:5000"  # 5050 côté Mac : le port 5000 y est pris par AirPlay
    volumes:
      - mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts  # le serveur sert les modèles : adresses valables partout
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=localhost,localhost:5000,localhost:5050,127.0.0.1:5050,mlflow,mlflow:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    image: gdiz-maintenance  # une seule image pour le pipeline et l'API
    command: [".venv/bin/python", "-m", "src.demarrer", "--preparer"]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONHASHSEED=0
      - GIT_PYTHON_REFRESH=quiet  # pas de git dans l'image : MLflow n'a pas à le signaler
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - donnees:/app/data

  api:
    image: gdiz-maintenance
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - donnees:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mlflow_data:
  donnees:
